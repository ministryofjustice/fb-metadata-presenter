version: 2.1
orbs:
  slack: circleci/slack@3.4.2

jobs:
  test:
    docker:
      - image: cimg/ruby:3.4.9
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - gem-cache-v1-{{ arch }}-{{ checksum "Gemfile.lock" }}
            - gem-cache-v1-{{ arch }}-
      - run:
          name: Dependencies
          command: bundle install --jobs 4 --retry 3
      - save_cache:
          key: gem-cache-v1-{{ arch }}-{{ checksum "Gemfile.lock" }}
          paths:
            - ~/.bundle
      - run:
          name: Security
          command: bundle exec brakeman -q --no-pager -i brakeman.ignore
      - run:
          name: Lint
          command: bundle exec rubocop
      - run:
          name: Test
          command: bundle exec rspec
      - slack/status: &slack_status
          fail_only: true
          only_for_branches: main
          failure_message: ":facepalm:  Failed job $CIRCLE_JOB  :homer-disappear:"
          include_job_number_field: false

  publish:
    docker:
      - image: cimg/ruby:3.4.9
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - gem-cache-v1-{{ arch }}-{{ checksum "Gemfile.lock" }}
            - gem-cache-v1-{{ arch }}-
      - run:
          name: Dependencies
          command: bundle install --jobs 4 --retry 3
      - save_cache:
          key: gem-cache-v1-{{ arch }}-{{ checksum "Gemfile.lock" }}
          paths:
            - ~/.bundle
      - run:
          name: Setup Rubygems
          command: |
            mkdir ~/.gem
            echo "---" > ~/.gem/credentials
            echo ":rubygems_api_key: $RUBYGEMS_API_KEY" >> ~/.gem/credentials
            chmod 0600 ~/.gem/credentials
      - run:
          name: Publish to Rubygems
          command: |
            VERSION=$(ruby -e "require './lib/metadata_presenter/version.rb'; puts MetadataPresenter::VERSION")
            PUBLISHED_VERSION=$(curl --silent --fail https://rubygems.org/api/v1/versions/metadata_presenter/latest.json | sed -e 's/[{}]/''/g' | sed s/\"//g | awk -v RS=',' -F: '$1=="version"{print $2}')

            if [ "$VERSION" != "$PUBLISHED_VERSION" ]
            then
              bundle exec gem build metadata_presenter.gemspec
              bundle exec gem push metadata_presenter-*.gem
              curl -X POST -H 'Content-type: application/json' --data "{\"text\":\":woohoo:  Successfully published ${CIRCLE_PROJECT_REPONAME} ${VERSION}  :ship_it_parrot:\"}" "$SLACK_WEBHOOK"
            fi
      - slack/status: *slack_status

workflows:
  version: 2
  test_and_build:
    jobs:
      - test:
          context: &moj-forms-context
            - moj-forms
      - publish:
          context: *moj-forms-context
          requires:
            - test
          filters:
            tags:
              only: /.*/
            branches:
              only: main